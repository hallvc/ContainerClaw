# fly.toml app configuration file generated for containerclaw on 2026-02-24T16:26:58-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'containerclaw'
primary_region = 'sjc'

[build]

[env]
  CONTAINERCLAW_DATA_DIR = '/data'
  CONTAINERCLAW_WORKSPACE = '/workspace'

[[mounts]]
  source = 'containerclaw_data'
  destination = '/data'

[http_service]
  internal_port = 18790
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
