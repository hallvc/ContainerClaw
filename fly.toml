app = "containerclaw"
primary_region = "ord"

[build]

[env]
  CONTAINERCLAW_DATA_DIR = "/data"
  CONTAINERCLAW_WORKSPACE = "/workspace"

[http_service]
  internal_port = 18790
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "containerclaw_data"
  destination = "/data"
