services:
  containerclaw:
    build: .
    restart: unless-stopped
    environment:
      # Required: OpenRouter API key for LLM access
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Slack channel (optional, at least one channel required)
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - SLACK_GROUP_POLICY=${SLACK_GROUP_POLICY:-mention}
      # Email channel via AgentMail (optional, at least one channel required)
      - AGENTMAIL_API_KEY=${AGENTMAIL_API_KEY:-}
      - AGENTMAIL_INBOX_ID=${AGENTMAIL_INBOX_ID:-}
      - AGENTMAIL_USERNAME=${AGENTMAIL_USERNAME:-}
      - AGENTMAIL_DOMAIN=${AGENTMAIL_DOMAIN:-}
      - AGENTMAIL_POLL_INTERVAL=${AGENTMAIL_POLL_INTERVAL:-15}
      - AGENTMAIL_POLICY=${AGENTMAIL_POLICY:-open}
      # Optional: Default model for all roles (defaults to minimax/minimax-m2.5)
      - CONTAINERCLAW_MODEL=${CONTAINERCLAW_MODEL:-minimax/minimax-m2.5}
      # Optional: Override model for chat (agent loop) only
      - CONTAINERCLAW_MODEL_CHAT=${CONTAINERCLAW_MODEL_CHAT:-}
      # Optional: Override model for memory consolidation only
      - CONTAINERCLAW_MODEL_MEMORY=${CONTAINERCLAW_MODEL_MEMORY:-}
      # Optional: Override model for image generation (must support image output)
      - CONTAINERCLAW_MODEL_IMAGE=${CONTAINERCLAW_MODEL_IMAGE:-google/gemini-2.5-flash-image}
      # Telegram channel (optional, at least one channel required)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOW_FROM=${TELEGRAM_ALLOW_FROM:-}
      # Object storage (S3-compatible via RustFS)
      - S3_ENDPOINT=${S3_ENDPOINT:-http://rustfs:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-containerclaw}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000}
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      # Persistent data: sessions, memory, cron jobs
      - ./data:/data
      # Workspace for the agent to operate in
      - ./workspace:/workspace

  rustfs-perms:
    image: alpine:latest
    command: sh -c "chown -R 10001:10001 /data"
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_VOLUMES=/data/rustfs{0...3}
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  rustfs-data-0:
  rustfs-data-1:
  rustfs-data-2:
  rustfs-data-3:
