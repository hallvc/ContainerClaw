services:
  nanobot:
    build: .
    restart: unless-stopped
    environment:
      # Required: OpenRouter API key for LLM access
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Required: Slack bot token (xoxb-...)
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      # Required: Slack app-level token (xapp-...)
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      # Optional: Default model for all roles (defaults to minimax/minimax-m2.5)
      - NANOBOT_MODEL=${NANOBOT_MODEL:-minimax/minimax-m2.5}
      # Optional: Override model for chat (agent loop) only
      - NANOBOT_MODEL_CHAT=${NANOBOT_MODEL_CHAT:-}
      # Optional: Override model for memory consolidation only
      - NANOBOT_MODEL_MEMORY=${NANOBOT_MODEL_MEMORY:-}
      # Optional: Brave Search API key for web_search tool
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      # Optional: Slack group policy (mention|open|allowlist, defaults to mention)
      - SLACK_GROUP_POLICY=${SLACK_GROUP_POLICY:-mention}
    volumes:
      # Persistent data: sessions, memory, cron jobs
      - nanobot-data:/data
      # Workspace for the agent to operate in
      - nanobot-workspace:/workspace

volumes:
  nanobot-data:
  nanobot-workspace:
